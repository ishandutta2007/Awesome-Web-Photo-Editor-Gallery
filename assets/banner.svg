<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="35%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#ec4899" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>

    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.12); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(2deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-2deg); }
      }
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes beamShimmer {
        0% { stop-color: #38bdf8; }
        33% { stop-color: #ec4899; }
        66% { stop-color: #a855f7; }
        100% { stop-color: #38bdf8; }
      }
      .glow-1 { animation: pulseGlow 7s ease-in-out infinite alternate; transform-origin: 250px 180px; }
      .glow-2 { animation: pulseGlow 9s ease-in-out 2s infinite alternate; transform-origin: 1050px 220px; }
      .glow-3 { animation: pulseGlow 8s ease-in-out 4s infinite alternate; transform-origin: 640px 90px; }
      .float-box-1 { animation: floatSlow 6s ease-in-out infinite; }
      .float-box-2 { animation: floatReverse 7s ease-in-out infinite; }
      .aperture-spin { animation: spinSlow 35s linear infinite; transform-origin: 1120px 210px; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; }
      .text-mono { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1280" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Light Orbs (Background only) -->
  <g opacity="0.45">
    <circle cx="220" cy="160" r="140" fill="#0284c7" filter="url(#glowCyan)" class="glow-1" />
    <circle cx="1060" cy="220" r="160" fill="#7c3aed" filter="url(#glowPurple)" class="glow-2" />
    <circle cx="640" cy="90" r="110" fill="#db2777" filter="url(#glowPink)" class="glow-3" />
  </g>

  <!-- Tech Grid Background Pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="420" />
    <line x1="200" y1="0" x2="200" y2="420" />
    <line x1="320" y1="0" x2="320" y2="420" />
    <line x1="440" y1="0" x2="440" y2="420" />
    <line x1="560" y1="0" x2="560" y2="420" />
    <line x1="680" y1="0" x2="680" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="920" y1="0" x2="920" y2="420" />
    <line x1="1040" y1="0" x2="1040" y2="420" />
    <line x1="1160" y1="0" x2="1160" y2="420" />

    <line x1="0" y1="70" x2="1280" y2="70" />
    <line x1="0" y1="140" x2="1280" y2="140" />
    <line x1="0" y1="210" x2="1280" y2="210" />
    <line x1="0" y1="280" x2="1280" y2="280" />
    <line x1="0" y1="350" x2="1280" y2="350" />
  </g>

  <!-- Decorative Camera Aperture Geometric Icon (Background Right) -->
  <g class="aperture-spin" opacity="0.12">
    <circle cx="1120" cy="210" r="130" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-dasharray="12 8" />
    <circle cx="1120" cy="210" r="95" stroke="#c084fc" stroke-width="1.5" fill="none" />
    <polygon points="1120,135 1195,190 1165,275 1075,275 1045,190" stroke="#38bdf8" stroke-width="2" fill="none" />
    <circle cx="1120" cy="210" r="45" stroke="#ec4899" stroke-width="2" fill="none" />
  </g>

  <!-- Decorative Floating Mini UI Cards (Background Left & Right, safe margin away from text) -->
  <g class="float-box-1" opacity="0.35">
    <g transform="translate(60, 48)">
      <rect width="130" height="65" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <circle cx="20" cy="22" r="5" fill="#ef4444" />
      <circle cx="34" cy="22" r="5" fill="#eab086" />
      <circle cx="48" cy="22" r="5" fill="#22c55e" />
      <rect x="15" y="38" width="90" height="7" rx="3.5" fill="#64748b" />
      <rect x="15" y="50" width="60" height="5" rx="2.5" fill="#475569" />
    </g>
  </g>

  <g class="float-box-2" opacity="0.35">
    <g transform="translate(1080, 290)">
      <rect width="140" height="75" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
      <rect x="14" y="16" width="35" height="35" rx="4" fill="#334155" />
      <path d="M 20 40 L 28 29 L 36 36 L 43 27 L 46 40 Z" fill="#60a5fa" />
      <rect x="58" y="18" width="68" height="6" rx="3" fill="#94a3b8" />
      <rect x="58" y="30" width="50" height="5" rx="2.5" fill="#64748b" />
      <rect x="58" y="42" width="58" height="5" rx="2.5" fill="#475569" />
    </g>
  </g>

  <!-- Outer Glowing Border -->
  <rect x="2" y="2" width="1276" height="416" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- FOREGROUND CONTENT: Guaranteed pristine visibility & hierarchy -->

  <!-- Top Category Tag -->
  <g transform="translate(80, 52)">
    <rect width="320" height="34" rx="17" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="20" cy="17" r="5" fill="#38bdf8" />
    <text x="36" y="22" fill="#38bdf8" font-size="12" class="text-mono" font-weight="600" letter-spacing="1.5">CURATED ECOSYSTEM DIRECTORY</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(80, 142)">
    <!-- Subtle drop shadow behind title for 100% crisp legibility -->
    <text x="0" y="0" fill="#000000" font-size="44" class="text-title" opacity="0.6" dy="2">Awesome Web Photo Editor &amp; Gallery</text>
    <text x="0" y="0" fill="url(#titleGrad)" font-size="44" class="text-title">Awesome Web Photo Editor &amp; Gallery</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(80, 192)">
    <text x="0" y="0" fill="#94a3b8" font-size="18.5" class="text-sub">
      The authoritative index of in-browser RAW editors, client proofing galleries, and self-hosted photo libraries.
    </text>
  </g>

  <!-- Dynamic Feature Badges / Highlights in Foreground -->
  <g transform="translate(80, 245)">
    <!-- Pill 1: RAW In-Browser -->
    <g transform="translate(0, 0)">
      <rect width="210" height="46" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
      <text x="20" y="28" font-size="18">🎨</text>
      <text x="48" y="28" fill="#f8fafc" font-size="13" class="text-title" font-weight="600">In-Browser RAW Editing</text>
    </g>

    <!-- Pill 2: AI Tagging & Vision -->
    <g transform="translate(225, 0)">
      <rect width="215" height="46" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" opacity="0.95" />
      <text x="18" y="28" font-size="18">🤖</text>
      <text x="46" y="28" fill="#f8fafc" font-size="13" class="text-title" font-weight="600">Local AI &amp; Semantic Search</text>
    </g>

    <!-- Pill 3: Self-Hosted Freedom -->
    <g transform="translate(455, 0)">
      <rect width="215" height="46" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" opacity="0.95" />
      <text x="18" y="28" font-size="18">🏠</text>
      <text x="46" y="28" fill="#f8fafc" font-size="13" class="text-title" font-weight="600">Self-Hosted Data Ownership</text>
    </g>

    <!-- Pill 4: Client Proofing & Delivery -->
    <g transform="translate(685, 0)">
      <rect width="225" height="46" rx="10" fill="#0f172a" stroke="#ec4899" stroke-width="1.2" opacity="0.95" />
      <text x="18" y="28" font-size="18">📸</text>
      <text x="46" y="28" fill="#f8fafc" font-size="13" class="text-title" font-weight="600">Client Proofing &amp; Delivery</text>
    </g>
  </g>

  <!-- Metric Badges Row -->
  <g transform="translate(80, 335)">
    <g transform="translate(0, 0)">
      <text x="0" y="0" fill="#38bdf8" font-size="20" class="text-title" font-weight="700">117K+ ⭐</text>
      <text x="0" y="20" fill="#64748b" font-size="11.5" class="text-mono">Top Open-Source Stacks</text>
    </g>
    <line x1="165" y1="-8" x2="165" y2="24" stroke="#334155" stroke-width="1" />
    <g transform="translate(195, 0)">
      <text x="0" y="0" fill="#818cf8" font-size="20" class="text-title" font-weight="700">$24B+ 📈</text>
      <text x="0" y="20" fill="#64748b" font-size="11.5" class="text-mono">Market Sector Size</text>
    </g>
    <line x1="340" y1="-8" x2="340" y2="24" stroke="#334155" stroke-width="1" />
    <g transform="translate(370, 0)">
      <text x="0" y="0" fill="#34d399" font-size="20" class="text-title" font-weight="700">100% 🔓</text>
      <text x="0" y="20" fill="#64748b" font-size="11.5" class="text-mono">Zero Vendor Lock-In</text>
    </g>
  </g>
</svg>